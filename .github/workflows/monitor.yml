name: Monitor Instagram reels

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      city_code:
        description: Optional cityCode to synchronize exclusively
        required: false
        type: string
      max_publish:
        description: Maximum Reels to publish (0 means use configured default)
        required: false
        default: "20"
        type: string
      sync_mode:
        description: Incremental, historical backfill, or baseline-only
        required: true
        default: incremental
        type: choice
        options: [incremental, backfill, baseline]
      backfill_since:
        description: Optional ISO-8601 lower bound for historical backfill
        required: false
        type: string
      dry_run:
        description: Discover and record only; do not upload or publish
        required: false
        default: false
        type: boolean

concurrency:
  group: instagram-reel-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLIP_API_URL: ${{ secrets.CLIP_API_URL }}
      CLIP_API_TOKEN: ${{ secrets.CLIP_API_TOKEN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      INSTAGRAM_SESSION_USERNAME: ${{ secrets.INSTAGRAM_SESSION_USERNAME }}
      INSTAGRAM_SESSION_FILE: ./data/instagram-session
      INSTAGRAM_PROVIDER: ${{ vars.INSTAGRAM_PROVIDER || 'instaloader' }}
      INSTAGRAM_GRAPH_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_ACCESS_TOKEN }}
      INSTAGRAM_GRAPH_API_VERSION: ${{ vars.INSTAGRAM_GRAPH_API_VERSION || 'v24.0' }}
      DATABASE_PATH: ./data/monitor.db
      DATABASE_OBJECT_KEY: automation/instagram-reel-monitor/monitor.db
      LEGACY_STATE_OBJECT_KEY: automation/instagram-reel-monitor/state.json
      SCAN_LIMIT: "30"
      ACCOUNTS_PER_RUN: "20"
      MAX_NEW_REELS_PER_PROFILE: "2"
      MAX_PUBLISH_PER_RUN: ${{ inputs.max_publish || '20' }}
      LOOKBACK_HOURS: "48"
      MAX_VIDEO_BYTES: "262144000"
      REQUEST_ATTEMPTS: "4"
      ONLY_CITY_CODE: ${{ inputs.city_code || '' }}
      SYNC_MODE: ${{ inputs.sync_mode || 'incremental' }}
      BACKFILL_SINCE: ${{ inputs.backfill_since || '' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore encrypted Instagram session
        if: env.INSTAGRAM_PROVIDER == 'instaloader'
        env:
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
        run: |
          test -n "$INSTAGRAM_SESSION_B64"
          mkdir -p data
          printf '%s' "$INSTAGRAM_SESSION_B64" | base64 --decode > "$INSTAGRAM_SESSION_FILE"
          chmod 600 "$INSTAGRAM_SESSION_FILE"
      - name: Validate configuration
        run: python -m reel_monitor.cli validate-config
      - name: Monitor and publish new reels
        run: python -m reel_monitor.cli sync
      - name: Remove restored Instagram session
        if: always() && env.INSTAGRAM_PROVIDER == 'instaloader'
        run: rm -f -- "$INSTAGRAM_SESSION_FILE"
