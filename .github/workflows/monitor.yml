name: Monitor Instagram reels

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      city_code:
        description: Optional city code to scan exclusively
        required: false
        type: string
      max_publish:
        description: Maximum reels to publish in this manual run (0 means unlimited)
        required: false
        default: "0"
        type: string
      publish_baseline:
        description: Allow a manual run to publish the latest baseline reel
        required: false
        default: false
        type: boolean

concurrency:
  group: instagram-reel-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CLIP_API_URL: ${{ secrets.CLIP_API_URL }}
      CLIP_API_TOKEN: ${{ secrets.CLIP_API_TOKEN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      INSTAGRAM_SESSION_USERNAME: ${{ secrets.INSTAGRAM_SESSION_USERNAME }}
      INSTAGRAM_SESSION_FILE: ./data/instagram-session
      STATE_OBJECT_KEY: automation/instagram-reel-monitor/state-${{ matrix.shard }}.json
      LEGACY_STATE_OBJECT_KEY: automation/instagram-reel-monitor/state.json
      PROFILE_SHARD_COUNT: "4"
      PROFILE_SHARD_INDEX: ${{ matrix.shard }}
      SCAN_LIMIT: "30"
      BROWSER_SCAN_LIMIT: "5"
      MAX_NEW_REELS_PER_PROFILE: "2"
      # Strict new-only mode: previously observed or already-published Reel IDs
      # must never be backfilled into the app.
      BACKFILL_EXISTING_REELS: "false"
      PROFILE_BATCH_SIZE: "5"
      BROWSER_PROFILE_TIMEOUT_MS: "10000"
      BROWSER_DETAIL_TIMEOUT_MS: "18000"
      ONLY_CITY_CODE: ${{ inputs.city_code || '' }}
      MAX_PUBLISH_PER_RUN: ${{ inputs.max_publish || '0' }}
      PUBLISH_BASELINE_REELS: ${{ inputs.publish_baseline || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore encrypted Instagram session
        env:
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
        run: |
          test -n "$INSTAGRAM_SESSION_B64"
          mkdir -p data
          printf '%s' "$INSTAGRAM_SESSION_B64" | base64 --decode > "$INSTAGRAM_SESSION_FILE"
          chmod 600 "$INSTAGRAM_SESSION_FILE"

      - name: Monitor and publish new reels
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 18
          max_attempts: 2
          retry_wait_seconds: 15
          command: python monitor.py

      - name: Remove restored Instagram session
        if: always()
        shell: bash
        run: rm -f -- "$INSTAGRAM_SESSION_FILE"

