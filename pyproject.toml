[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brokket-instagram-reel-monitor"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "instaloader>=4.14,<5",
]

[project.scripts]
reel-monitor = "reel_monitor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
